# Host nginx site for the WhatsApp dashboard.
# Use this when port 80/443 are already taken (typical: system nginx).
# Do not enable the compose "caddy" profile in that case.
#
# Install:
#   sudo cp deploy/nginx-waha.cravingcodetech.in.conf /etc/nginx/sites-available/waha.cravingcodetech.in
#   sudo ln -sf /etc/nginx/sites-available/waha.cravingcodetech.in /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d waha.cravingcodetech.in

server {
    listen 80;
    listen [::]:80;
    server_name waha.cravingcodetech.in;

    client_max_body_size 100M;

    location /api {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
    }
}
