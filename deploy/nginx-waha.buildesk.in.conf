# Restore WAHA Plus dashboard if the host nginx site was lost.
#   sudo cp deploy/nginx-waha.buildesk.in.conf /etc/nginx/sites-available/waha.buildesk.in
#   sudo ln -sf /etc/nginx/sites-available/waha.buildesk.in /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# SSL: certbot --nginx -d waha.buildesk.in  (skip if cert already exists)

server {
    listen 80;
    listen [::]:80;
    server_name waha.buildesk.in;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
    }
}
